
services:
  hadoop:
    image: harisekhon/hadoop:latest
    container_name: hadoop-single-node
    ports:
    
      - "9870:9870"
      - "9864:9864"
      - "8088:8088"
      - "19888:19888"
    volumes:
      - ./hadoop_ingest:/tmp/ingest
      - ./mapreduce:/tmp/mapreduce
    environment:
      - HADOOP_HEAPSIZE=512
    networks:
      - monitor

  coordinator1:
    build: ./coordinator
    container_name: coordinator1
    environment:
      - FLASK_ENV=development
      - COORDINATOR_ID=1
    depends_on:
      - kafka
    volumes:
      - ./coordinator:/app
      - ./hadoop_ingest:/app/hadoop_ingest
      - ./mapreduce:/app/mapreduce
      - ./travel.db:/app/travel.db
    networks:
      - monitor

  coordinator2:
    build: ./coordinator
    container_name: coordinator2
    environment:
      - FLASK_ENV=development
      - COORDINATOR_ID=2
    depends_on:
      - kafka
    volumes:
      - ./coordinator:/app
      - ./hadoop_ingest:/app/hadoop_ingest
      - ./mapreduce:/app/mapreduce
      - ./travel.db:/app/travel.db
    networks:
      - monitor

  coordinator3:
    build: ./coordinator
    container_name: coordinator3
    environment:
      - FLASK_ENV=development
      - COORDINATOR_ID=3
    depends_on:
      - kafka
    volumes:
      - ./coordinator:/app
      - ./hadoop_ingest:/app/hadoop_ingest
      - ./mapreduce:/app/mapreduce
      - ./travel.db:/app/travel.db
    networks:
      - monitor

  nginx:
    image: nginx:latest
    container_name: nginx-coordinator
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - coordinator1
      - coordinator2
      - coordinator3
    networks:
      - monitor
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"

    ports:
      - "2181:2181"
    networks:
      - monitor

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - monitor

  worker_hotels:
    build: ./worker
    container_name: worker_hotels
    environment:
      - WORKER_TYPE=hotels
    depends_on:
      - kafka
    networks:
      - monitor

  worker_restaurants:
    build: ./worker
    container_name: worker_restaurants
    environment:
      - WORKER_TYPE=restaurants
    depends_on:
      - kafka
    networks:
      - monitor

  worker_events:
    build: ./worker
    container_name: worker_events
    environment:
      - WORKER_TYPE=events
    depends_on:
      - kafka
    networks:
      - monitor

  worker_transport:
    build: ./worker
    container_name: worker_transport
    environment:
      - WORKER_TYPE=transport
    depends_on:
      - kafka
    networks:
      - monitor


networks:
  monitor:
    driver: bridge

  